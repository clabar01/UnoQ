<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Medford Weather Bar</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <main class="stage">
    <h1>Medford, MA Weather</h1>
    <p>The current conditions are shown in the status bar below.</p>
  </main>

  <footer class="statusbar" id="statusbar">
    <span class="icon" id="icon">⋯</span>
    <span class="label">Medford, MA</span>
    <span class="desc" id="desc">Loading…</span>
    <span class="temp" id="temp"></span>
  </footer>

  <script src="libs/socket.io.min.js"></script>
  <script src="app.js"></script>
</body>

</html>
